<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EXO · We Are One</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#05060f;--silver:#e8ecff;--dim:#8f98c4;--glow:#7aa7ff;--line:#ffffff22}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,#1b2255 0,#0a0c24 45%,var(--bg) 100%) fixed;color:var(--silver);font-family:Rajdhani,"Segoe UI",sans-serif;font-size:17px;min-height:100vh;overflow-x:hidden}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:24px 18px 80px}
.top{display:flex;justify-content:space-between;align-items:center;font:500 12px Orbitron,sans-serif;letter-spacing:.35em;color:var(--dim)}
.hero{text-align:center;padding:50px 0 24px;position:relative}
.orb{position:absolute;left:50%;top:6px;width:min(420px,80vw);aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#9fc0ff55,#4b5cff22 45%,transparent 70%);filter:blur(2px);animation:pulse 6s ease-in-out infinite}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.07);opacity:.7}}
h1{position:relative;margin:0;font:900 clamp(64px,18vw,170px)/1 Orbitron,sans-serif;letter-spacing:.12em;margin-right:-.12em;background:linear-gradient(180deg,#fff,#9fb4ff 70%,#4b5cff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 28px #6d8bff88)}
h1::before,h1::after{content:attr(data-t);position:absolute;inset:0;background:inherit;-webkit-background-clip:text;background-clip:text;color:transparent;mix-blend-mode:screen}
h1::before{animation:gl1 4s infinite;clip-path:inset(0 0 60% 0);filter:hue-rotate(80deg)}
h1::after{animation:gl2 4s infinite;clip-path:inset(60% 0 0 0);filter:hue-rotate(-80deg)}
@keyframes gl1{0%,90%,100%{transform:none}93%{transform:translate(-6px,0)}96%{transform:translate(5px,0)}}
@keyframes gl2{0%,88%,100%{transform:none}91%{transform:translate(6px,0)}95%{transform:translate(-5px,0)}}
.slogan{position:relative;font:500 14px Orbitron,sans-serif;letter-spacing:.6em;color:var(--dim);margin-top:6px}
.about{position:relative;max-width:680px;margin:22px auto 0;color:#c8d0f5;line-height:1.55}
.about a{color:var(--glow)}
.sec{font:700 14px Orbitron,sans-serif;letter-spacing:.4em;color:var(--dim);margin:44px 0 18px;display:flex;align-items:center;gap:14px}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.card{--c:#7aa7ff;position:relative;background:linear-gradient(180deg,#ffffff0d,#ffffff05);border:1px solid var(--line);border-radius:6px;padding:0;overflow:hidden;cursor:pointer;color:inherit;font:inherit;text-align:left;transition:.3s;animation:rise .7s backwards;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%)}
.card:hover{border-color:var(--c);box-shadow:0 0 34px -4px var(--c),inset 0 0 40px -20px var(--c);transform:translateY(-6px)}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
.pic{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;display:block;filter:saturate(.9) contrast(1.05);transition:.4s;background:linear-gradient(160deg,#1b2255,#05060f)}
.card:hover .pic{transform:scale(1.06);filter:saturate(1.2)}
.ph{display:grid;place-items:center;font:900 64px Orbitron;color:var(--c);opacity:.6}
.b{padding:12px 14px 16px}
.b h3{margin:0;font:700 15px Orbitron,sans-serif;letter-spacing:.08em}
.b p{margin:4px 0 0;font-size:14px;color:var(--dim)}
.power{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:3px 10px;border:1px solid var(--c);border-radius:99px;font:600 11px Orbitron,sans-serif;letter-spacing:.14em;color:var(--c);text-shadow:0 0 10px var(--c);box-shadow:0 0 12px -4px var(--c)}
.power i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.num{position:absolute;top:8px;left:10px;font:900 13px Orbitron;color:#fff9;text-shadow:0 0 8px #000}
.galaxy{display:flex;flex-wrap:wrap;gap:10px}
.pill{background:none;border:1px solid var(--line);color:var(--silver);padding:8px 16px;border-radius:99px;font:600 12px Orbitron,sans-serif;letter-spacing:.14em;cursor:pointer;transition:.25s}
.pill:hover,.pill.on{border-color:var(--glow);box-shadow:0 0 18px -3px var(--glow);color:#fff}
.msg{text-align:center;color:var(--dim);padding:30px;letter-spacing:.1em}.err{color:#ff8a9a}
.status{margin-top:40px;text-align:center;font-size:12px;color:#5d668f;letter-spacing:.1em;word-break:break-all}
#modal{position:fixed;inset:0;background:#02030bcc;backdrop-filter:blur(8px);display:none;place-items:center;z-index:5;padding:18px}
#modal.on{display:grid}
.sheet{--c:#7aa7ff;max-width:640px;width:100%;display:grid;grid-template-columns:minmax(0,230px) 1fr;background:#0b0e26;border:1px solid var(--c);box-shadow:0 0 60px -10px var(--c);animation:rise .4s}
.sheet img,.sheet .ph{width:100%;height:100%;min-height:280px;object-fit:cover;object-position:top}
.sheet .in{padding:22px}.sheet h2{margin:0 0 4px;font:900 24px Orbitron;letter-spacing:.08em}
.sheet dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:14px 0;font-size:15px}.sheet dt{color:var(--dim)}.sheet dd{margin:0}
.x{background:none;border:1px solid var(--line);color:var(--silver);padding:8px 16px;font:600 12px Orbitron;letter-spacing:.2em;cursor:pointer}
@media(max-width:600px){.sheet{grid-template-columns:1fr}.sheet img,.sheet .ph{min-height:0;aspect-ratio:3/2}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="wrap">
  <div class="top"><span>PLANET EXO</span><span>EXO-L ✦ LIVE DATA</span></div>
  <section class="hero">
    <div class="orb"></div>
    <h1 data-t="EXO">EXO</h1>
    <div class="slogan">WE ARE ONE</div>
    <p class="about" id="about">Establishing connection to the galaxy…</p>
  </section>

  <div class="sec" id="mTitle">THE MEMBERS</div>
  <div id="members"><p class="msg">LOADING TRANSMISSION…</p></div>

  <div class="sec">OTHER GALAXIES</div>
  <div class="galaxy" id="galaxy"></div>
  <div class="status" id="status"></div>
</div>

<div id="modal"><div class="sheet" id="sheet"></div></div>

<script>
/* ---------- starfield ---------- */
(() => {
  const c = document.getElementById("stars"), x = c.getContext("2d"); let W, H, S = [];
  const init = () => { W = c.width = innerWidth; H = c.height = innerHeight; S = Array.from({length: Math.min(220, W/5)}, () => ({x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.4+.2, v:Math.random()*.25+.03, t:Math.random()*6})); };
  addEventListener("resize", init); init();
  (function loop(){ x.clearRect(0,0,W,H); for(const s of S){ s.y -= s.v; s.t += .03; if(s.y < 0){ s.y = H; s.x = Math.random()*W; } x.globalAlpha = .4 + .6*Math.abs(Math.sin(s.t)); x.fillStyle = "#cfd8ff"; x.beginPath(); x.arc(s.x, s.y, s.r, 0, 7); x.fill(); } requestAnimationFrame(loop); })();
})();

/* ---------- data ---------- */
const OTHERS = ["BTS","Blackpink","NewJeans","Twice_(group)","Aespa","Ive_(group)","Stray_Kids","Seventeen_(South_Korean_band)","Le_Sserafim","Itzy","Red_Velvet_(group)","Tomorrow_X_Together","Enhypen","Nct_127","Shinee","Super_Junior","Girls%27_Generation"];
const EXO_TITLE = "Exo_(band)";
/* Original EXO concept powers (fan lore from the debut era) */
const POWERS = [
  {re:/xiumin|min-?seok/i,  n:"Xiumin", p:"Ice", c:"#9fe8ff"},
  {re:/suho|jun-?myeon/i,   n:"Suho", p:"Water", c:"#3a8dff"},
  {re:/\blay\b|yixing/i,    n:"Lay", p:"Healing", c:"#7dffb0"},
  {re:/baekhyun|baek-?hyun/i,n:"Baekhyun", p:"Light", c:"#fff6a0"},
  {re:/chanyeol|chan-?yeol/i,n:"Chanyeol", p:"Fire", c:"#ff5a3c"},
  {re:/\bd\.?o\.?\b|kyung-?soo/i,n:"D.O.", p:"Earth", c:"#c99a64"},
  {re:/\bchen\b|jong-?dae/i,n:"Chen", p:"Lightning", c:"#ffe14d"},
  {re:/\bkai\b|jong-?in/i,  n:"Kai", p:"Teleportation", c:"#c07bff"},
  {re:/sehun|se-?hun/i,     n:"Sehun", p:"Wind", c:"#c9d8ff"},
  {re:/kris|yifan/i,        n:"Kris", p:"Flight", c:"#8affff"},
  {re:/luhan|lu han/i,      n:"Luhan", p:"Telekinesis", c:"#ff7bd5"},
  {re:/\btao\b|zitao/i,     n:"Tao", p:"Time Control", c:"#a8b5ff"}
];
const powerOf = n => POWERS.find(p => p.re.test(n));
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id), st = $("status");
let current = null;

/* API 1: Wikipedia REST */
async function getGroup(title){
  const r = await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/" + (title.includes("%") ? title : encodeURIComponent(title)));
  if(!r.ok) throw new Error(title + " " + r.status);
  const j = await r.json();
  return {title, name: j.titles?.normalized || j.title, desc: j.description || "", extract: j.extract || "", page: j.content_urls?.desktop?.page || "", qid: j.wikibase_item};
}
/* API 2: Wikidata SPARQL */
async function getMembers(qid){
  const q = `SELECT ?m ?mLabel (SAMPLE(?i) AS ?img) (SAMPLE(?d) AS ?dob) (SAMPLE(?pl) AS ?pob) (SAMPLE(?al) AS ?alias) WHERE {
    {wd:${qid} wdt:P527 ?m} UNION {?m wdt:P463 wd:${qid}} ?m wdt:P31 wd:Q5.
    OPTIONAL{?m wdt:P18 ?i} OPTIONAL{?m wdt:P569 ?d}
    OPTIONAL{?m wdt:P19 ?p. ?p rdfs:label ?pl FILTER(lang(?pl)="en")}
    OPTIONAL{?m skos:altLabel ?al FILTER(lang(?al)="en")}
    SERVICE wikibase:label {bd:serviceParam wikibase:language "en".}
  } GROUP BY ?m ?mLabel ORDER BY ?dob`;
  st.textContent = "QUERY · Wikidata SPARQL · members of " + qid;
  const r = await fetch("https://query.wikidata.org/sparql?format=json&query=" + encodeURIComponent(q));
  if(!r.ok) throw new Error("Wikidata " + r.status);
  const j = await r.json(), seen = new Set();
  return j.results.bindings.map(b => ({id:b.m.value.split("/").pop(), name:b.mLabel.value, alias:b.alias?.value||"", img:b.img ? b.img.value.replace("http://","https://") + "?width=420" : "", dob:b.dob ? b.dob.value.slice(0,10) : "", pob:b.pob?.value||""}))
    .filter(m => !/^Q\d+$/.test(m.name) && !seen.has(m.id) && seen.add(m.id));
}
const fmt = d => d ? new Date(d+"T00:00:00").toLocaleDateString("en",{year:"numeric",month:"long",day:"numeric"}) : "—";

/* ---------- render ---------- */
function ph(m, c){ return `<div class="pic ph" style="--c:${c}">${esc(m.name[0])}</div>`; }
async function openGroup(g, isExo){
  current = g.title;
  document.querySelectorAll(".pill").forEach(p => p.classList.toggle("on", p.dataset.t === g.title));
  document.querySelector("h1").textContent = isExo ? "EXO" : g.name.toUpperCase();
  document.querySelector("h1").dataset.t = document.querySelector("h1").textContent;
  document.querySelector("h1").style.fontSize = (!isExo && g.name.length > 6) ? "clamp(36px,9vw,84px)" : "";
  $("about").innerHTML = esc(g.extract) + (g.page ? ` <a href="${esc(g.page)}" target="_blank" rel="noopener">Wikipedia ↗</a>` : "");
  $("mTitle").textContent = "THE MEMBERS";
  const box = $("members");
  box.innerHTML = '<p class="msg">LOADING TRANSMISSION…</p>';
  if(!isExo) window.scrollTo({top:0, behavior:"smooth"});
  if(!g.qid){ box.innerHTML = '<p class="msg">NO MEMBER DATA FOUND</p>'; return; }
  try{
    const ms = await getMembers(g.qid);
    if(current !== g.title) return;
    if(!ms.length){ box.innerHTML = '<p class="msg">NO MEMBER LIST ON WIKIDATA</p>'; return; }
    st.textContent = ms.length + " members loaded · Wikidata";
    box.innerHTML = '<div class="grid">' + ms.map((m,i) => {
      const pw = isExo ? (powerOf(m.name) || powerOf(m.alias)) : null, c = pw ? pw.c : ["#7aa7ff","#c07bff","#7dffb0","#ff7bd5"][i%4];
      m.pw = pw; m.c = c;
      return `<button class="card" data-i="${i}" style="--c:${c};animation-delay:${i*70}ms"><span class="num">${String(i+1).padStart(2,"0")}</span>${m.img ? `<img class="pic" loading="lazy" src="${esc(m.img)}" alt="${esc(m.name)}" onerror="this.outerHTML='<div class=\\'pic ph\\'>${esc(m.name[0])}</div>'">` : ph(m,c)}<div class="b"><h3>${esc(pw ? pw.n.toUpperCase() : m.name)}</h3><p>${esc(pw ? m.name : (m.pob||""))}</p>${pw ? `<span class="power"><i></i>${pw.p.toUpperCase()}</span>` : ""}</div></button>`;
    }).join("") + "</div>";
    box.querySelectorAll(".card").forEach(b => b.onclick = () => openModal(ms[+b.dataset.i], g));
  }catch(e){ box.innerHTML = '<p class="msg err">SIGNAL LOST · ' + esc(e.message) + '. TRY AGAIN SOON.</p>'; }
}

function openModal(m, g){
  $("sheet").style.setProperty("--c", m.c);
  $("sheet").innerHTML = (m.img ? `<img src="${esc(m.img)}" alt="${esc(m.name)}">` : `<div class="ph" style="color:${m.c}">${esc(m.name[0])}</div>`) +
    `<div class="in"><h2>${esc(m.pw ? m.pw.n.toUpperCase() : m.name)}</h2><div style="color:var(--dim)">${esc(g.name)}</div>${m.pw ? `<span class="power" style="margin-top:12px"><i></i>${m.pw.p.toUpperCase()}</span>` : ""}
    <dl><dt>Name</dt><dd>${esc(m.name)}</dd><dt>Born</dt><dd>${esc(fmt(m.dob))}</dd><dt>Birthplace</dt><dd>${esc(m.pob || "—")}</dd></dl><button class="x" id="cl">CLOSE</button></div>`;
  $("modal").classList.add("on");
  $("cl").onclick = () => $("modal").classList.remove("on");
}
$("modal").onclick = e => { if(e.target.id === "modal") $("modal").classList.remove("on"); };
addEventListener("keydown", e => { if(e.key === "Escape") $("modal").classList.remove("on"); });

/* ---------- boot ---------- */
(async () => {
  st.textContent = "GET · en.wikipedia.org/api/rest_v1/page/summary/Exo_(band)";
  let exo = null;
  try{ exo = await getGroup(EXO_TITLE); }catch(e){ $("about").textContent = ""; $("members").innerHTML = '<p class="msg err">COULD NOT REACH THE APIS. OPEN THIS FILE IN A NORMAL BROWSER WITH INTERNET.</p>'; return; }
  const gal = $("galaxy");
  const exoPill = document.createElement("button"); exoPill.className = "pill on"; exoPill.dataset.t = EXO_TITLE; exoPill.textContent = "EXO"; exoPill.onclick = () => openGroup(exo, true); gal.appendChild(exoPill);
  openGroup(exo, true);
  const res = await Promise.allSettled(OTHERS.map(getGroup));
  res.filter(r => r.status === "fulfilled").forEach(r => { const g = r.value, p = document.createElement("button"); p.className = "pill"; p.dataset.t = g.title; p.textContent = g.name.toUpperCase(); p.onclick = () => openGroup(g, false); gal.appendChild(p); });
})();
</script>
</body>
</html>
